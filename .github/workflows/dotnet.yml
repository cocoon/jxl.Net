name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - uses: nuget/setup-nuget@v1
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore nuget dependencies
      run: nuget restore jxlNET.sln
      
    - name: Build
      run: msbuild /p:Configuration=Release

    - name: Publish single-file app
      run: dotnet publish ./WpfExampleCore/WpfExampleCore.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:EnableCompressionInSingleFile=true -f net10.0-windows -p:AllowUnsafeBlocks=true
    
    # Upload the artifacts: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts jxl.net
      uses: actions/upload-artifact@v4
      with:
        name: jxl.net
        path: jxl.net\bin\x64\Release
    - name: Upload build artifacts jxlViewer
      uses: actions/upload-artifact@v4
      with:
        name: jxlViewer
        path: jxlViewer\bin\x64\Release
    - name: Upload build artifacts WpfExample
      uses: actions/upload-artifact@v4
      with:
        name: WpfExample
        path: WpfExample\bin\x64\Release
    - name: Upload build artifacts WpfExampleCore
      uses: actions/upload-artifact@v4
      with:
        name: WpfExampleCore
        path: WpfExampleCore\bin\Release\net10.0-windows\win-x64\publish
